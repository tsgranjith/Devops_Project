name: Build and Push Docker Image

on:
 workflow_dispatch: 
  push:
    branches:
      - master
    paths:
      - "my-docker-app/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./my-docker-app
          push: true
          tags: nadhranjith/my-first-web-app:latest

          
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
         sudo docker pull nadhranjith/my-first-web-app:latest
         sudo docker rm -f my-web-app || true
         sudo docker run -d --restart unless-stopped --name my-web-app -p 5000:5000 nadhranjith/my-first-web-app:latest
